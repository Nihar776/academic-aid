# ---- where PDFs go -------------------------------------------------------
# Point this at your local or cloud-synced folder
# Windows example: "G:/My Drive/PYQs"      Mac example: "~/Google Drive/My Drive/PYQs"
output_dir: "./PYPs/Semester-05/"

# Question Papers section URL on Knimbus (used as the starting point)
base_url: "https://dbatulibrary.knimbus.com/portal/v2/default/results/section?sectionId=1ad6bd68-4cc6-4d8b-8550-2203b35075ef&sectionName=QUESTION+PAPERS"

# ---- Optional credentials for auto-login ----------------------------------
# If set, the script can log in automatically even in headless mode.
# If left empty, run 'python pyq_fetch.py' in your own terminal to log in interactively.
credentials:
  email: "createlearningforall@gmail.com"
  password: "Abc@123"

# ---- course / degree filter ----------------------------------------------
# Target degree/course type. Papers downloaded will match this course.
# Options matching Knimbus REPOSITORY filter:
#   - "B.Tech Question Paper"  (or shorthand: "btech")   <-- DEFAULT (B.Tech only)
#   - "Diploma Question Paper" (or shorthand: "diploma")
#   - "M.Tech Question Paper"  (or shorthand: "mtech")
#   - "B. Pharmacy Question Paper" (or shorthand: "pharmacy")
#   - "B. Architecture Question Paper" (or shorthand: "architecture")
#   - "all" (downloads across all courses without filtering)
course: "B.Tech Question Paper"

# Last years -> exam year must be >= this (e.g. 2022..2026)
since_year: 2022

# ---- branch / discipline filter ------------------------------------------
# Narrow papers down to specific branches/disciplines.
# Matches Knimbus SUBJECT filter and DBATU course codes.
# Options:
#   - "Computer Engineering"
#   - "Computer Science and Engineering"
#   - "Information Technology"
# Leave [] or omit to accept all branches.
branches:
  - "Computer Engineering"
  - "Computer Science and Engineering"
  - "Information Technology"

max_pages: 15          # safety cap on result pages per subject

# ---- subjects ------------------------------------------------------------
# search   : query typed in Knimbus "search within results"
# keywords : ALL must appear in the card title
# exclude  : if ANY appears in title, paper is skipped (e.g. "advanced" to drop "Advanced Machine Learning")
# sem      : target semester (e.g. 5, [5, 6], or null to accept all semesters)
# codes    : optional list of course codes (leave [] to accept all codes)
subjects:
  - name: Machine Learning
    search: machine learning
    keywords: ["machine learning"]
    exclude: ["advanced", "introduction"]
    sem: null
    codes: []

  - name: Theory of Computations
    search: theory of computation
    keywords: ["theory of computation"]
    exclude: []
    sem: null
    codes: []

  - name: Operating Systems
    search: operating systems
    keywords: ["operating system"]
    exclude: ["advanced"]
    sem: null
    codes: []

  - name: Database Management Systems
    search: database management
    keywords: ["database"]
    exclude: ["advanced"]
    sem: null
    codes: []

  - name: Computer Graphics
    search: computer graphics
    keywords: ["computer graphics"]
    exclude: []
    sem: null
    codes: []

  - name: Foundations of Quantum Technologies
    search: quantum
    keywords: ["quantum"]
    exclude: ["mtech", "advanced"]
    sem: null
    codes: []

  - name: Entrepreneurship Skills and Digital Marketing Strategies
    search: entrepreneurship
    keywords: ["entrepreneurship"]
    exclude: []
    sem: null
    codes: []


